appId: com.taskmanager.app
---
# Flujo E2E propio de la Actividad 3.
# Recorrido: abrir la app -> crear una tarea -> verificar que aparece en la
# lista -> eliminarla desde el diálogo de confirmación -> verificar que la
# app vuelve al estado vacío. Complementa a crear_tarea.yaml y
# flujo_completo_tareas.yaml (provistos por el docente), que no cubren el
# borrado de tareas.
#
# Nota: el toque sobre "Eliminar tarea ..." que abre el diálogo de
# confirmación puede fallar de forma intermitente (el propio proyecto de
# referencia del docente tiene el mismo comportamiento documentado: el
# Modal tarda en entrar al árbol de accesibilidad). Se envuelve en un
# bloque "retry" para que, si el primer toque no abre el diálogo, Maestro
# lo vuelva a intentar automáticamente hasta 3 veces.

# 1. Abrir la app con estado limpio (sin tareas de corridas anteriores)
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Task Manager"
    timeout: 10000
- tapOn: "Flujo Todo List"
- extendedWaitUntil:
    visible: "Nueva tarea"
    timeout: 10000
- assertVisible: "No hay tareas aún"

# 2. Crear una tarea nueva
- tapOn:
    id: "input-titulo"
- inputText: "Revisar accesibilidad del formulario"
- tapOn: "Guardar"
- assertVisible: "Tarea creada exitosamente"
- assertVisible: "Revisar accesibilidad del formulario"

# 3. Eliminar la tarea y confirmar, con reintento automático
- retry:
    maxRetries: 3
    commands:
      - tapOn: "Eliminar tarea Revisar accesibilidad del formulario"
      - assertVisible: "Confirmar eliminación"
- tapOn: "Confirmar eliminación"

# 4. Verificar que vuelve al estado vacío
- assertVisible: "No hay tareas aún"
