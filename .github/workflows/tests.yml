name: Test Suite

on:
  push:
    branches: [main, develop, actividad3-final, actividad4-final]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: Verificar tipos
        run: npx tsc --noEmit

      - name: Ejecutar pruebas con cobertura (falla si baja del 70%)
        run: npx jest --coverage --ci

      - name: Publicar reporte de cobertura como evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura
          path: coverage/
          retention-days: 30
